# Multi-Project Workload & Resource Balancing Hub — dev-host stack
# ADR-ARCH-011 (dev-host) · TD-005 · PLAN-002
# Postgres 16 · Kafka 3.7 KRaft (no ZooKeeper) · Hub Spring Boot

name: hub

services:

  postgres:
    image: postgres:16-alpine
    container_name: hub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      TZ: Asia/Saigon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub} -d ${POSTGRES_DB:-hub}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: hub-kafka
    environment:
      # KRaft (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      # Topic 'hub.audit' default retention — F-ARCH-NEW-02 Reading A (7 days default; configurable)
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-9MLSTKC0SxuW1KUR8kjYwQ}
      TZ: Asia/Saigon
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  hub:
    image: com.mbs/hub:${HUB_VERSION:-0.1.0-SNAPSHOT}
    container_name: hub-app
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hub}
      DB_USER: ${POSTGRES_USER:-hub}
      DB_PASS: ${POSTGRES_PASSWORD:-hub}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TZ: Asia/Saigon
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -Xss512k"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      # Bind to 127.0.0.1 only — UI must NOT be publicly reachable (TD-COND-01).
      # The public tunnel forwards only /webhooks/jira; see deploy/tunnel-cloudflared.yml.example.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
  kafkadata:
